name: Build LLPlayer (Windows WPF)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore LLPlayer/LLPlayer.csproj

    - name: Publish Release Build (Win-x64 Self-Contained)
      run: |
        dotnet publish LLPlayer/LLPlayer.csproj -c Release -r win-x64 --self-contained true -o publish_output

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LLPlayer-win-x64
        path: publish_output/
